name: Daily Frontend Audit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Audit Script Executable
        run: chmod +x scripts/audits/frontend_audit.sh

      - name: Run Frontend Audit
        run: ./scripts/audits/frontend_audit.sh

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b kaizen/daily-audit-${{ github.run_id }}

          git add docs/audits/ docs/EVOLUTION_LOG.md

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: auditoria frontend diaria"
            git push origin kaizen/daily-audit-${{ github.run_id }}
            gh pr create \
              --title "Kaizen: Auditoria Frontend Diaria" \
              --body "Automated daily frontend audit execution." \
              --base master \
              --head kaizen/daily-audit-${{ github.run_id }} || echo "PR already exists"
          fi
