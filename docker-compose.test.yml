# Docker Compose para entorno de pruebas de integración (Backend + DB)
# Se levantan servicios mínimos necesarios para validar PRs.

services:
  # Base de datos MySQL Compartida para Tests
  gesfer-test-db:
    image: mysql:8.0
    container_name: gesfer_test_db
    restart: unless-stopped
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=256M
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ScrapDb
      MYSQL_USER: scrapuser
      MYSQL_PASSWORD: scrappassword
      TZ: UTC
    ports:
      - "3307:3306" # Puerto alternativo para no chocar con desarrollo (3306)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - gesfer_test_network

  # Product API Test
  gesfer-product-api-test:
    build:
      context: .
      dockerfile: src/Product/Back/Dockerfile
    container_name: gesfer_product_api_test
    restart: unless-stopped
    ports:
      - "5001:5000" # Usamos 5001 para que los scripts existentes funcionen, aunque internamente escucha en 5000
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ASPNETCORE_URLS=http://+:5000
      # Conectar a la DB de test en la red interna
      - ConnectionStrings__DefaultConnection=Server=gesfer-test-db;Port=3306;Database=ScrapDb;User=scrapuser;Password=scrappassword;CharSet=utf8mb4;AllowUserVariables=True;AllowLoadLocalInfile=True;
      # Apuntar a Admin API Test (si se levanta, sino mockear o dejar fallar graceful)
      - AdminApi__BaseUrl=http://gesfer-admin-api-test:5010
      - Database__AutoRunMigrations=true
    depends_on:
      gesfer-test-db:
        condition: service_healthy
    networks:
      - gesfer_test_network

  # Admin API Test
  gesfer-admin-api-test:
    build:
      context: .
      dockerfile: src/Admin/Back/Dockerfile
    container_name: gesfer_admin_api_test
    restart: unless-stopped
    ports:
      - "5011:5010" # Puerto alternativo
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ASPNETCORE_URLS=http://+:5010
      - ConnectionStrings__DefaultConnection=Server=gesfer-test-db;Port=3306;Database=ScrapDb;User=scrapuser;Password=scrappassword;CharSet=utf8mb4;AllowUserVariables=True;AllowLoadLocalInfile=True;
      - Database__AutoRunMigrations=true
    depends_on:
      gesfer-test-db:
        condition: service_healthy
    networks:
      - gesfer_test_network

networks:
  gesfer_test_network:
    driver: bridge
