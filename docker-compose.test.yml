version: '3.8'

services:
  # Servicio para tests de Frontend (Product)
  frontend-test:
    image: node:20-alpine
    working_dir: /app/src/Product/Front
    volumes:
      - ./:/app
      # Volúmenes anónimos para evitar contaminar el host con node_modules de Linux
      - /app/src/Product/Front/node_modules
      - /app/src/Product/Front/.next
    environment:
      - CI=true
    command: sh -c "npm ci && npm run test:all"

  # Servicio para tests de Backend (Integration)
  backend-test:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app
    volumes:
      - ./:/app
      # Mapear socket de Docker para permitir Testcontainers (si se instala CLI en el futuro)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOTNET_CLI_HOME=/tmp/dotnet
      - ASPNETCORE_ENVIRONMENT=Testing
